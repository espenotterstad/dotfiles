# ~/.config/starship.toml
# Gruvbox Dark palette + powerline layout

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](purple)\
$os\
$username\
[](bg:yellow fg:purple)\
$directory\
[](fg:yellow bg:aqua)\
$git_branch\
$git_status\
[](fg:aqua bg:blue)\
$nodejs\
$rust\
$golang\
$python\
$java\
$docker_context\
[](fg:blue bg:orange)\
$time\
[ ](fg:orange)\
$line_break\
$character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
# backgrounds
bg      = "#282828"
bg1     = "#3c3836"
bg2     = "#504945"
bg3     = "#665c54"
bg4     = "#7c6f64"
# foregrounds
fg      = "#ebdbb2"
fg2     = "#d5c4a1"
fg3     = "#bdae93"
fg4     = "#a89984"
# accent colours (bright variants for segment backgrounds)
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
purple  = "#d3869b"
aqua    = "#8ec07c"
orange  = "#fe8019"
gray    = "#928374"

[os]
disabled = false
style = "bg:purple fg:bg"

[os.symbols]
Debian  = " "
Ubuntu  = " "
Macos   = " "
Linux   = " "
Windows = " "

[username]
show_always = true
style_user = "bg:purple fg:bg"
style_root = "bg:red fg:bg"
format = '[ $user ]($style)'
disabled = false

[directory]
style = "bg:yellow fg:bg"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = " "
"Pictures"  = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:aqua fg:bg"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:aqua fg:bg"
format = '[($all_status$ahead_behind )]($style)'

[nodejs]
symbol = ""
style = "bg:blue fg:bg"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:blue fg:bg"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = ""
style = "bg:blue fg:bg"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = ""
style = "bg:blue fg:bg"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:blue fg:bg"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = ""
style = "bg:blue fg:bg"
format = '[ $symbol $context ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:orange fg:bg"
format = '[  $time ]($style)'

[line_break]
disabled = false

[character]
success_symbol = '[❯](bold green)'
error_symbol   = '[❯](bold red)'
vimcmd_symbol  = '[❮](bold yellow)'
