# ~/.config/kitty/open-actions.conf
# Controls what happens when you Ctrl+Shift+click a file/URL/line.
# Auto-loaded by kitty if present.

# vscode:// URLs → open in VS Code (delta hyperlinks use this scheme)
protocol vscode
action launch --type=background sh -c "code --goto $(echo ${URL} | sed 's|vscode://file/||')"

# Source code file paths → open in VS Code at the clicked line
protocol file
mime text/*
action launch --type=background code --goto ${FILE_PATH}:${FRAGMENT}

# Common dev-file extensions kitty doesn't auto-detect as text/*
protocol file
ext py,js,ts,tsx,jsx,rs,go,c,h,cpp,hpp,java,rb,sh,yaml,yml,toml,json,md,html,css,scss,vue,svelte,lua,nix,zig
action launch --type=background code --goto ${FILE_PATH}:${FRAGMENT}

# Directories → open as new VS Code window
protocol file
mime inode/directory
action launch --type=background code ${FILE_PATH}
