# ~/.config/kitty/ssh.conf
# Default behavior for `kitten ssh` (use `s hostname` per the bashrc alias).
# This installs kitty's terminfo on remote (no more "unknown terminal type"),
# and enables shell integration so prompt-jumping works on remote shells too.

shell_integration enabled

# Sync nothing by default — safer than auto-pushing dotfiles.
# To copy your bashrc to remote, uncomment:
# copy --dest=.bashrc-kitty ~/.bashrc

# Per-host overrides go below (one block each):
#
# hostname myserver.example.com
# copy ~/.config/some-tool/config
# env MY_VAR=value
