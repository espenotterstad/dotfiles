# ~/.config/kitty/kitty.conf
# Reload after edits: Ctrl+Shift+F5

# ── Font ──────────────────────────────────────────────────────────────
font_family      Fira Code
bold_font        Fira Code Bold
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never

# Nerd Font symbols as fallback (powerline arrows, file/git icons, etc.)
# Fira Code lacks these glyphs; Symbols Nerd Font fills them in.
symbol_map U+E0A0-U+E0A3,U+E0B0-U+E0BF,U+E0C0-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EBEB,U+F000-U+F2FF,U+F300-U+F381,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 Symbols Nerd Font Mono

# ── Cursor ────────────────────────────────────────────────────────────
cursor_shape         beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 5.0

# ── Scrollback ────────────────────────────────────────────────────────
scrollback_lines 10000
scrollback_pager_history_size 100

# ── Mouse ─────────────────────────────────────────────────────────────
mouse_hide_wait 3.0
copy_on_select  yes
strip_trailing_spaces smart

# ── URLs ──────────────────────────────────────────────────────────────
url_color #89b4fa
url_style curly
detect_urls yes

# ── Window ────────────────────────────────────────────────────────────
remember_window_size  yes
initial_window_width  1100
initial_window_height 700
enabled_layouts splits,stack
window_border_width 1pt
draw_minimal_borders yes
inactive_text_alpha 0.85

# ── Background opacity / blur ─────────────────────────────────────────
background_opacity 0.92
background_blur    20
dynamic_background_opacity yes

# ── Tab bar (powerline) ───────────────────────────────────────────────
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{index}: {title}"
active_tab_font_style   bold
inactive_tab_font_style normal

# ── Bell ──────────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.1
window_alert_on_bell yes

# ── Shell ─────────────────────────────────────────────────────────────
shell           .
shell_integration enabled no-cursor no-title no-prompt-mark
allow_remote_control yes

# ── Performance ───────────────────────────────────────────────────────
repaint_delay   10
input_delay     3
sync_to_monitor yes

# ── Keybindings: splits ───────────────────────────────────────────────
# Create splits
map ctrl+shift+enter   launch --location=hsplit --cwd=current
map ctrl+shift+\       launch --location=vsplit --cwd=current
map ctrl+shift+]       next_window
map ctrl+shift+[       previous_window

# Move focus between splits (Alt+arrow keys)
map alt+left   neighboring_window left
map alt+right  neighboring_window right
map alt+up     neighboring_window up
map alt+down   neighboring_window down

# Move/swap windows (Ctrl+Shift+Alt+arrow)
map ctrl+shift+alt+left   move_window left
map ctrl+shift+alt+right  move_window right
map ctrl+shift+alt+up     move_window up
map ctrl+shift+alt+down   move_window down

# Resize splits
map ctrl+shift+r start_resizing_window

# Toggle between splits and stack layouts
map ctrl+shift+l next_layout
map ctrl+shift+z toggle_layout stack

# ── Keybindings: tabs ─────────────────────────────────────────────────
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab

# ── Keybindings: opacity ──────────────────────────────────────────────
map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
map ctrl+shift+a>1 set_background_opacity 1
map ctrl+shift+a>d set_background_opacity default

# ── Keybindings: dev workflow ─────────────────────────────────────────
# Search recent output with hyperlinked grep (clickable results → VS Code)
map ctrl+shift+g>r launch --type=overlay kitten hyperlinked_grep --kitten-only

# Open scrollback in $EDITOR
map ctrl+shift+h show_scrollback

# Quick kitten ssh prompt (kitty asks for hostname)
map ctrl+shift+g>s launch --type=overlay sh -c 'printf "ssh to: "; read host; exec kitten ssh "$host"'

# ── Theme ─────────────────────────────────────────────────────────────
include gruvbox-dark.conf
